<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>todoary</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- 진단용: 로드/실행 에러를 화면에 직접 표시 (에러가 없으면 아무것도 안 보임) -->
  <script>
    (function () {
      function box() {
        var d = document.getElementById("__errbox");
        if (!d) {
          d = document.createElement("pre");
          d.id = "__errbox";
          d.style.cssText =
            "position:fixed;inset:0;z-index:99999;margin:0;padding:16px;background:#fff;color:#c00;font:12px/1.5 monospace;white-space:pre-wrap;overflow:auto";
          (document.body || document.documentElement).appendChild(d);
        }
        return d;
      }
      window.addEventListener(
        "error",
        function (e) {
          var t = e.target;
          if (t && (t.src || t.href)) {
            box().textContent += "[리소스 로드 실패] " + (t.src || t.href) + "\n";
          } else {
            box().textContent +=
              "[error] " + (e.message || "") +
              (e.filename ? " @ " + e.filename + ":" + e.lineno : "") + "\n";
          }
        },
        true
      );
      window.addEventListener("unhandledrejection", function (e) {
        var r = e.reason;
        box().textContent +=
          "[promise] " + (r && (r.stack || r.message) ? r.stack || r.message : r) + "\n";
      });
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Gaegu:wght@300;400;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />

  <style>
    html, body { height: 100%; margin: 0; background: #f5e9e2; }
    #root { width: 100vw; height: 100vh; }
  </style>

  <!-- CDN 대신 로컬 번들 (오프라인/패키징 환경에서도 동작) -->
  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>
  <script src="vendor/babel.min.js"></script>

  <!-- 작업방 (Firebase) — config 없으면 자동 로컬 모드 -->
  <script src="vendor/firebase-config.js"></script>
  <!-- 익명 활성 사용자 집계 (작업방과 분리) -->
  <script type="text/babel" src="v2/analytics.jsx"></script>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="v2/i18n.jsx"></script>
  <script type="text/babel" src="v2/store.jsx"></script>
  <script type="text/babel" src="v2/work-time-ui.jsx"></script>
  <script type="text/babel" src="v2/ai.jsx"></script>
  <script type="text/babel" src="v2/views-shared.jsx"></script>
  <script type="text/babel" src="v2/music.jsx"></script>
  <script type="text/babel" src="v2/view-today.jsx"></script>
  <script type="text/babel" src="v2/view-todo.jsx"></script>
  <script type="text/babel" src="v2/view-memo.jsx"></script>
  <script type="text/babel" src="v2/view-mail.jsx"></script>
  <script type="text/babel" src="v2/view-prompt.jsx"></script>
  <script type="text/babel" src="v2/view-ai.jsx"></script>
  <script type="text/babel" src="v2/view-retro.jsx"></script>
  <script type="text/babel" src="v2/room-dev-sandbox.jsx"></script>
  <script type="text/babel" src="v2/firebase-bridge.jsx"></script>
  <script type="text/babel" src="v2/room-store.jsx"></script>
  <script type="text/babel" src="v2/view-room.jsx"></script>
  <script type="text/babel" src="v2/timer.jsx"></script>
  <script type="text/babel" src="v2/tracker.jsx"></script>
  <script type="text/babel" src="v2/photocard.jsx"></script>
  <script type="text/babel" src="v2/side-dock-v2.jsx"></script>

  <!-- Dev cache-buster: when served from localhost, append ?_=<ts> to every
       JSX src so the browser never serves a stale transpilation. No-op in
       Tauri / file:// or any non-localhost host. Runs synchronously during
       HTML parsing — before Babel's DOMContentLoaded handler fires. -->
  <script>
    (function () {
      var h = location.hostname;
      if (h !== 'localhost' && h !== '127.0.0.1') return;
      var ts = Date.now();
      document.querySelectorAll('script[type="text/babel"][src]').forEach(function (s) {
        s.src = s.src + (s.src.indexOf('?') >= 0 ? '&' : '?') + '_=' + ts;
      });
    })();
  </script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "dockSide": "right",
      "tabSide": "right",
      "tabAccent": "#ffc7d4",
      "bgType": "linear",
      "bgAngle": 180,
      "bgStops": [{ "c": "#a9cdf5", "p": 0 }, { "c": "#ffffff", "p": 100 }],
      "bgShape": "none",
      "chromeColor": "#a9cdf5",
      "chromeGradient": true,
      "appSize": "normal",
      "appHeight": 0,
      "appPosX": -1,
      "appPosY": -1,
      "appPosPhysical": true,
      "showFakeIde": true,
      "desktopMode": false,
      "alwaysOnTop": false,
      "showPomodoro": true,
      "showRoomTab": true,
      "dockHidden": false,
      "tabsHidden": false
    }/*EDITMODE-END*/;

    // Tauri 속에서 실행중이면 자동으로 데스크탑 모드 점이고 transparent body
    // 주의: window.isTauri 는 Tauri 가 읽기전용으로 주입하므로 변수명을 겹치지 않게 둔다
    const runningInTauri = !!(window.__TAURI__ || window.__TAURI_INTERNALS__);
    if (runningInTauri) TWEAK_DEFAULTS.desktopMode = true;
    document.documentElement.setAttribute("data-desktop-mode", String(TWEAK_DEFAULTS.desktopMode));

    // 창 위치는 Tauri PhysicalPosition(px) 그대로 저장 — logical÷scale 변환 오차로
    // 오른쪽 끝에 붙는 클램프 버그를 피함.
    const APP_POS_MIGRATION_KEY = "todoary.appPos.physical-v1";

    async function todoaryReadWindowPos(win) {
      const phys = await win.outerPosition();
      return { x: Math.round(phys.x), y: Math.round(phys.y) };
    }

    function todoaryPosToTweak(pos) {
      return { appPosX: pos.x, appPosY: pos.y, appPosPhysical: true };
    }

    async function todoaryClampPhysicalPos(win, x, y, logicalW, logicalH) {
      if (!win.currentMonitor) return { x, y };
      const mon = await win.currentMonitor();
      if (!mon) return { x, y };
      const scale = (win.scaleFactor ? await win.scaleFactor() : mon.scaleFactor) || 1;
      const wPhys = Math.round(logicalW * scale);
      const hPhys = Math.round(logicalH * scale);
      const mx = (mon.workAreaPosition || mon.position).x;
      const my = (mon.workAreaPosition || mon.position).y;
      const mw = (mon.workArea || mon.size).width;
      const mh = (mon.workArea || mon.size).height;
      return {
        x: Math.max(mx, Math.min(mx + Math.max(0, mw - wPhys), x)),
        y: Math.max(my, Math.min(my + Math.max(0, mh - hPhys), y)),
      };
    }

    async function todoaryApplyWindowPos(win, pos, logicalW, logicalH) {
      const T = window.__TAURI__;
      const PP = T && T.window && T.window.PhysicalPosition;
      if (!PP || !pos) return;
      const clamped = (logicalW && logicalH)
        ? await todoaryClampPhysicalPos(win, pos.x, pos.y, logicalW, logicalH)
        : pos;
      await win.setPosition(new PP(clamped.x, clamped.y));
    }

    async function todoarySaveNormalWindowPos() {
      try {
        const T = window.__TAURI__;
        if (!T || !T.window || !T.window.getCurrentWindow) return null;
        const pos = await todoaryReadWindowPos(T.window.getCurrentWindow());
        window.__TODOARY_SAVED_NORMAL_POS__ = pos;
        return pos;
      } catch (_) { return null; }
    }
    window.todoarySaveNormalWindowPos = todoarySaveNormalWindowPos;

    function todoaryGetDockMiniSize() {
      try {
        if (window.TODOARY_DOCK_MINI && window.TODOARY_DOCK_MINI.getSize) {
          return window.TODOARY_DOCK_MINI.getSize();
        }
      } catch (_) {}
      return { w: 148, h: 78 };
    }

    function todoaryGetSavedNormalPos(t) {
      const mem = window.__TODOARY_SAVED_NORMAL_POS__;
      if (mem && Number.isFinite(mem.x) && Number.isFinite(mem.y)) return mem;
      if (t && t.appPosPhysical && t.appPosX >= 0 && t.appPosY >= 0) {
        return { x: t.appPosX, y: t.appPosY };
      }
      return null;
    }

    function App() {
      useI18n(); // 언어 변경 시 전체 리렌더
      const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
      React.useEffect(() => {
        try {
          if (!localStorage.getItem(APP_POS_MIGRATION_KEY)) {
            setTweak({ appPosX: -1, appPosY: -1, appPosPhysical: true });
            localStorage.setItem(APP_POS_MIGRATION_KEY, "1");
          }
        } catch (_) {}
      }, []);
      React.useEffect(() => {
        const saved = todoaryGetSavedNormalPos(t);
        if (saved) window.__TODOARY_SAVED_NORMAL_POS__ = saved;
      }, []);
      React.useEffect(() => {
        document.documentElement.setAttribute("data-desktop-mode", String(t.desktopMode));
      }, [t.desktopMode]);

      // 포인트 색 적용 (저장값 복원 포함)
      React.useEffect(() => { window.applyAccent && window.applyAccent(t.tabAccent); }, [t.tabAccent]);
      // 헤더·바 색을 CSS 변수로 노출 (달력 헤더 등에서 사용)
      React.useEffect(() => {
        document.documentElement.style.setProperty("--chrome", t.chromeColor || "#a9cdf5");
      }, [t.chromeColor]);

      // 창 크기: 최초엔 마지막 길이 복원, 이후 프리셋 변경 시 그 높이로
      // dockHidden(미니화) 일 때는 다른 effect 가 처리하므로 여기선 건너뜀
      const sizedRef = React.useRef(false);
      const dockTransitionRef = React.useRef(false);
      React.useEffect(() => {
        if (t.dockHidden || dockTransitionRef.current) return;
        (async () => {
          try {
            const T = window.__TAURI__;
            if (!T || !T.window || !T.window.getCurrentWindow) return;
            const win = T.window.getCurrentWindow();
            const avail = window.screen.availHeight || 900;
            const base = Math.max(520, Math.min(Math.round(avail * 0.92), avail - 20));
            const preset = t.appSize === "compact" ? Math.round(base * 0.42)
                         : t.appSize === "medium" ? Math.round(base * 0.7)
                         : base;
            const first = !sizedRef.current;
            const h = (first && t.appHeight > 0) ? Math.min(t.appHeight, avail - 10) : preset;
            sizedRef.current = true;
            await win.setSize(new T.window.LogicalSize(440, h));
            if (first) {
              const saved = todoaryGetSavedNormalPos(t);
              if (saved) await todoaryApplyWindowPos(win, saved, 440, h);
            }
          } catch (_) {}
        })();
      }, [t.appSize]);

      // 일반 모드에서 창을 옮기면 마지막 위치를 계속 기억 (미니 복귀용)
      React.useEffect(() => {
        const T = window.__TAURI__;
        if (!T || !T.window || !T.window.getCurrentWindow) return;
        const win = T.window.getCurrentWindow();
        let unlisten;
        let moveTimer;
        (async () => {
          try {
            if (!win.onMoved) return;
            unlisten = await win.onMoved(({ payload }) => {
              if (t.dockHidden || dockTransitionRef.current) return;
              clearTimeout(moveTimer);
              moveTimer = setTimeout(() => {
                try {
                  const pos = { x: Math.round(payload.x), y: Math.round(payload.y) };
                  window.__TODOARY_SAVED_NORMAL_POS__ = pos;
                  setTweak(todoaryPosToTweak(pos));
                } catch (_) {}
              }, 250);
            });
          } catch (_) {}
        })();
        return () => {
          clearTimeout(moveTimer);
          if (unlisten) unlisten();
        };
      }, [t.dockHidden]);

      // 도크 미니화 — Tauri 창 자체를 위젯 크기로 축소해서 데스크탑 위 자유 이동.
      // dockHidden true → 위젯 크기(148/168×78)로 축소
      // dockHidden false → 저장된 위치·크기로 복원
      const prevDockHiddenRef = React.useRef(null);
      React.useEffect(() => {
        const T = window.__TAURI__;
        if (!T || !T.window || !T.window.getCurrentWindow) return;
        const win = T.window.getCurrentWindow();
        const LS = T.window.LogicalSize;
        const wasHidden = prevDockHiddenRef.current;
        const isFirst = wasHidden === null;
        const enteringMini = !isFirst && t.dockHidden && !wasHidden;
        const exitingMini = !isFirst && !t.dockHidden && wasHidden;
        prevDockHiddenRef.current = t.dockHidden;
        dockTransitionRef.current = true;
        (async () => {
          try {
            const mini = todoaryGetDockMiniSize();
            if (t.dockHidden) {
              if (enteringMini && !window.__TODOARY_SAVED_NORMAL_POS__) {
                try {
                  const pos = await todoarySaveNormalWindowPos();
                  if (pos) setTweak(todoaryPosToTweak(pos));
                } catch (_) {}
              }
              await win.setMinSize(new LS(Math.max(120, mini.w - 24), Math.max(56, mini.h - 16)));
              await win.setSize(new LS(mini.w, mini.h));
              if (win.setResizable) { try { await win.setResizable(false); } catch (_) {} }
            } else {
              if (win.setResizable) { try { await win.setResizable(true); } catch (_) {} }
              await win.setMinSize(new LS(380, 360));
              const avail = window.screen.availHeight || 900;
              const base = Math.max(520, Math.min(Math.round(avail * 0.92), avail - 20));
              const preset = t.appSize === "compact" ? Math.round(base * 0.42)
                           : t.appSize === "medium" ? Math.round(base * 0.7)
                           : base;
              const h = t.appHeight > 0 ? Math.min(t.appHeight, avail - 10) : preset;
              const w = 440;
              if (exitingMini) {
                const saved = todoaryGetSavedNormalPos(t);
                if (saved) await todoaryApplyWindowPos(win, saved, w, h);
              }
              await win.setSize(new LS(w, h));
            }
          } catch (e) { console.warn("dockHidden window resize failed:", e); }
          finally { dockTransitionRef.current = false; }
        })();
      }, [t.dockHidden]);

      // 반복 할 일 인스턴스 자동 생성 (앱 시작 + 매 분 확인해 자정 넘어가면 새로 생성)
      React.useEffect(() => {
        try { diary.actions.generateRecurrences(); } catch (_) {}
        const id = setInterval(() => { try { diary.actions.generateRecurrences(); } catch (_) {} }, 60 * 1000);
        return () => clearInterval(id);
      }, []);

      // 익명 활성 사용자 집계 — 앱 실행 시 1회 (주기 전송 없음)
      React.useEffect(() => {
        try { window.todoaryAnalytics && window.todoaryAnalytics.trackAppLaunch(); } catch (_) {}
      }, []);

      // 항상 위 — tweak 변경 시 Tauri 창 옵션에 반영
      React.useEffect(() => {
        try {
          const T = window.__TAURI__;
          if (!T || !T.window || !T.window.getCurrentWindow) return;
          T.window.getCurrentWindow().setAlwaysOnTop(!!t.alwaysOnTop);
        } catch (_) {}
      }, [t.alwaysOnTop]);

      // 창 높이 변화(드래그/프리셋)를 마지막 길이로 저장 (디바운스)
      React.useEffect(() => {
        let tid;
        const on = () => {
          clearTimeout(tid);
          tid = setTimeout(() => { if (window.innerHeight > 200) setTweak("appHeight", window.innerHeight); }, 450);
        };
        window.addEventListener("resize", on);
        return () => { window.removeEventListener("resize", on); clearTimeout(tid); };
      }, []);
      return (
        <>
          <SideDockV2 tweaks={t} setTweak={setTweak} />
          <DialogHost />
          <ActivityTracker />
          <AutoPauseWatcher />
          <WorkSessionBootstrap />
          <RoomSyncBridge />
          <RetroModal />
          <TweaksPanel title="Tweaks">
            <TweakSection label="레이아웃">
              <TweakToggle
                label="데스크탑 모드 (투명)"
                value={t.desktopMode}
                onChange={(v) => setTweak("desktopMode", v)}
              />
              <TweakRadio
                label="도크 위치"
                value={t.dockSide}
                onChange={(v) => setTweak("dockSide", v)}
                options={[
                  { value: "left",  label: "왼쪽" },
                  { value: "right", label: "오른쪽" },
                ]}
              />
              <TweakRadio
                label="인덱스 탭 방향"
                value={t.tabSide}
                onChange={(v) => setTweak("tabSide", v)}
                options={[
                  { value: "right", label: "바깥" },
                  { value: "left",  label: "안쪽" },
                ]}
              />
            </TweakSection>
            <TweakSection label="액센트">
              <TweakColor
                label="포인트 컬러"
                value={t.tabAccent}
                onChange={(v) => {
                  setTweak("tabAccent", v);
                  document.documentElement.style.setProperty("--hi", v);
                }}
                options={["#ffc7d4", "#c5e8d4", "#c8dffb", "#d8cdf5", "#fff4c0", "#ffd3b6"]}
              />
            </TweakSection>
          </TweaksPanel>
        </>
      );
    }

    // 초기 포인트 컬러 적용 (버튼 등 일괄)
    window.applyAccent ? window.applyAccent(TWEAK_DEFAULTS.tabAccent) : document.documentElement.style.setProperty("--hi", TWEAK_DEFAULTS.tabAccent);

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
